name: Bug Report
description: Create a report to help us improve Awake
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check if a similar issue already exists before submitting.
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: What version of macOS are you running? (e.g. macOS 15.0 Sequoia, macOS 14.6 Sonoma)
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Hardware Architecture
      description: What processor architecture is your Mac using?
      options:
        - "Apple Silicon (M1 / M2 / M3 / M4)"
        - "Intel (x86_64)"
    validations:
      required: true
  - type: input
    id: awake-version
    attributes:
      label: Awake Version
      description: Which version of Awake are you using? (e.g. v1.0.0 or commit hash)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Awake from menu bar
        2. Set timer to 15m
        3. Close MacBook lid
        4. See sleep behavior
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Logs
      description: Add any other context, screenshots, or terminal logs here.
